upstream studydy_backend {
    zone studydy_backend 64k;
    # Resolve the backend through Docker DNS after container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8001 resolve;
}

server {
    listen 8080 default_server;
    server_name "";
    return 400;
}

server {
    listen 8080;
    server_name innoserve-en.studydy.net 127.0.0.1 localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Do not expose the private HTTP scheme or port in redirects.
    absolute_redirect off;
    client_max_body_size ${STUDYDY_UPLOAD_MAX_BYTES};
    access_log off;

    location ~ ^/v[0-9]+(?:/|$) {
        proxy_pass http://studydy_backend;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Connecting-IPv6 "";
        proxy_set_header CF-Pseudo-IPv4 "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Access-Jwt-Assertion "";
        proxy_set_header CF-Access-Authenticated-User-Email "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
